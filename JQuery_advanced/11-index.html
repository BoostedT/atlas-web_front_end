<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8" />
  <title>Task 12</title>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <script type="application/javascript">
    function addPostRow(data) {
      const paragraph = $("<p>");
      const content = `Post created with id ${data.id}, title: ${data.title}, author: ${data.author}`;
      paragraph.append($("<span>").text(content));
      $("body").append(paragraph);
    }

    function listPosts() {
      $.get("http://localhost:3000/posts")
        .done(function (response) {
          response.forEach(function (post) {
            addPostRow(post);
          });
        })
        .fail(function () {
          alert("Server Error");
        });
    }

    function buildForm() {
      const form = $("<form>");
      const authorDiv = $("<div>");
      const titleDiv = $("<div>");

      const authorLabel = $("<label>").attr("for", "author").text("Author");
      const authorInput = $("<input>").attr({ type: "text", id: "author" });

      const titleLabel = $("<label>").attr("for", "title").text("Title");
      const titleTextarea = $("<textarea>").attr("id", "title");

      const submitBtn = $("<input>").attr("type", "submit").val("Submit");

      authorDiv.append(authorLabel, authorInput);
      titleDiv.append(titleLabel, titleTextarea);
      form.append(authorDiv, titleDiv, submitBtn);
      $("body").append(form);

      form.submit(function (e) {
        e.preventDefault();
        sendForm(form);
      });
    }

    function sendForm(formElement) {
      const author = $("#author").val();
      const title = $("#title").val();

      const data = {
        title: title,
        author: author
      };

      formElement.after($("<p>").text("About to send the query to the API"));

      $.ajax({
        url: "http://localhost:3000/posts",
        method: "POST",
        contentType: "application/json",
        data: JSON.stringify(data),
        success: function (response) {
          addPostRow(response);
        },
        error: function () {
          alert("Error sending the POST query");
        }
      });
    }
      $(document).ready(function () {
        listPosts();
        buildForm();
      });
  </script>
</head>

<body>

</body>

</html>
