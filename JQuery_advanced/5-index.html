<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8" />
  <title>Task 6</title>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <script type="application/javascript">
    function createFamilyTree() {
      $("body").append(
        $("<table>").append(
          $("<thead>").append(
            $("<tr>").append(
              $("<th>").text("Firstname"),
              $("<th>").text("Lastname")
            )
          )
        ),
        $("<tbody>")
      );
    }

    function addNewMember(firstName, lastName) {
      const row = $("<tr>");
      row.append($("<td>").text(firstName));
      row.append($("<td>").text(lastName));

      const removeCell = $("<td>").text("(x)").css("background-color", "orange");
      removeCell.click(function () {
        row.remove();
      });

      row.append(removeCell);
      $("tbody").append(row);
    }

    $(document).ready(function () {
      createFamilyTree();

      addNewMember("Guillaume", "Salva");
      addNewMember("Arielle", "Snizt");
      addNewMember("Fanette", "Snizt");
      addNewMember("Gerard", "Snizt");
      addNewMember("Victor", "Salva");
    });
  </script>
</head>

</html>
