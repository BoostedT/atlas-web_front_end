<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8" />
  <title>Task 8</title>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <script type="application/javascript">
    function createSearchForm() {
    const form = $("<form>");
    const input = $("<input>").attr("type", "text");
    const submit = $("<input>").attr("type", "submit").val("Submit");
    const resultsList = $("<ul>");

    form.append(input, submit);
    $("body").append(form, resultsList);

    form.submit(function (e) {
      e.preventDefault();
      const search = input.val().trim();
      if (search !== "") {
        resultsList.empty();
        queryWikipedia(search);
      }
    });
  }

  function addNewArticle(id, title, snippet) {
    const li = $("<li>");
    const p1 = $("<p>").html(`<span>${id} - </span><b>${title}</b>`);
    const p2 = $("<p>").html(snippet);
    li.append(p1, p2);
    $("ul").append(li);
  }

  function queryWikipedia(search) {
    const apiUrl = "https://en.wikipedia.org/w/api.php";

    const data = {
      action: "query",
      list: "search",
      format: "json",
      srsearch: search,
      origin: "*"
    };

    $.ajax({
      url: apiUrl,
      method: "GET",
      data: data,
      success: function (response) {
        const results = response.query.search;
        results.forEach(result => {
          addNewArticle(result.pageid, result.title, result.snippet);
        });
      },
      error: function () {
        $("ul").append("<li>Error retrieving results</li>");
      }
    });
  }

  $(document).ready(function () {
    createSearchForm();
  });
  </script>
</head>
