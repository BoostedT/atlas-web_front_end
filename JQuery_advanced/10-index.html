<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <title>Task 11</title>

  <!-- jQuery minified for ajax support -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <script type="application/javascript">
    function addPostRow(data) {
      const paragraph = $("<p>");
      const content = `Post created with id ${data.id}, title: ${data.title}, author: ${data.author}`;
      paragraph.append($("<span>").text(content));
      $("body").append(paragraph);
    }

    function listPosts() {
      $.get("http://localhost:3000/posts")
        .done(function (response) {
          response.forEach(function (post) {
            addPostRow(post);
          });
        })
        .fail(function () {
          alert("Server Error");
        });
    }

    $(document).ready(function () {
      listPosts();
    });
  </script>
</head>
<body>

</body>
</html>
